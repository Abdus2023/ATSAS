producer: secret-leak-scan
version: "1.x"
aif_version: "0.1"
role: evidence-producer

outputs:
  evidence: true
  findings: true
  verification: limited

produces:
  - evidence
  - findings
  - verification

does_not_produce:
  - authority
  - admission
  - completion

authority: false
admission: false
completion: false
mutation: false

snapshot_binding: required
execution_binding: required

claim_scope:
  bounded: true
  source_type: SCANNER_RESULT
  supported_propositions:
    - "No configured secret-pattern matches exist in the scanned paths."
    - "No secret-pattern matches were found in the scanned paths."
  forbidden_propositions:
    - "The repository contains no secrets."
    - "No secrets exist anywhere."

finding_categories:
  - SECRET_SCAN
  - SECRET_PATTERN_MATCH
  - SECRET_SCAN_COVERAGE_LIMITED

limitations:
  - scanner-specific coverage
  - pattern-dependent detection
  - working-tree only (does not scan full git history)
  - no live credential verification
  - no universal absence proof
